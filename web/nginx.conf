# StudyRoute web server (sandbox). Serves the static export of the Next.js app and proxies the API on
# the same origin, so the browser needs no CORS and the CSP stays at default-src 'self'.
# The security headers come from security_headers.conf, which the build writes: the project's policy
# plus the hashes of the exported inline bootstrap scripts (see scripts/csp-hashes.mjs).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 128k;
  server_tokens off;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Cloud chat can use a bounded inference plus one safety retry.
    proxy_read_timeout 210s;
    # No add_header here: the API sets its own security headers (a stricter CSP), and adding
    # nginx's would send each of them twice.
  }

  location = /health {
    proxy_pass http://backend:8000/health;
  }

  # Hashed build output: cache for a year.
  location /_next/static/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    include /etc/nginx/security_headers.conf;
  }

  # Every screen is exported as <route>/index.html. Anything else falls back to the app shell.
  location / {
    try_files $uri $uri/index.html /index.html;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/security_headers.conf;
  }
}
