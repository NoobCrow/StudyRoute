arrival_labels:
  value:
    accommodation: {label: "Book a place to live before you fly", hint: "Start with your university's own halls or accommodation office. Never pay a landlord you have not checked, and keep every receipt."}
    arrival_money: {label: "Plan the first month's money", hint: "The first month costs more than the rest: deposit, bedding and a travel pass. Use the Budget tab and send the money early."}
    health_cover: {label: "Arrange health cover", hint: "Check what your visa and university require. Keep the policy number on your phone."}
    travel_documents: {label: "Pack your documents", hint: "Passport, visa papers, offer letter and your address in hand luggage, with copies kept somewhere else."}
    bank_letter: {label: "Ask your university for a bank letter", hint: "Many banks want a letter that confirms you are a student before they open an account."}
    student_account: {label: "Open a student bank account", hint: "Take your passport, visa papers and the university letter. Ask about fees and about receiving money from abroad."}
    local_sim: {label: "Get a local SIM or eSIM", hint: "Your bank and university send security codes by phone. Compare student plans before you sign."}
    enrol: {label: "Finish enrolment and collect your student card", hint: "Register with the university in the first week. The card often brings discounts and library access."}
    emergency_numbers: {label: "Save the emergency numbers", hint: "Police, ambulance, your embassy and your university's help line."}
    transport_card: {label: "Get a student travel card", hint: "Ask the university which student transport discounts apply."}
    scams: {label: "Learn the common student scams", hint: "Fake rental adverts, fake visa agents and fake fee-collection calls target new students. Check any request for money with the university first."}
    work_rules: {label: "Know how much you may work", hint: "Check the official visa page for work limits. Breaking them can end your visa."}
    register_address: {label: "Register your address if required", hint: "Some countries ask students to register where they live. Your international office will say whether yours does."}
    budget_check: {label: "Check your first month against your budget", hint: "Compare what you spent with the Budget tab. If it is higher, tell your family early."}
    link_account: {label: "Share your new account with your family", hint: "Send the bank details through a safe channel. Never share passwords, card numbers or one-time codes."}
    gb_visa_documents: {label: "Check how you receive your visa documents", hint: "The international office will explain whether you collect a card or use an online account. Do it in the first days."}
    gb_doctor: {label: "Register with a local doctor (GP)", hint: "Registering while you are well is easier than when you are ill. Ask your university how."}
    us_i20: {label: "Keep your I-20 with your passport", hint: "You will be asked for it at the border and by your university. Keep it in your hand luggage."}
    us_work_permission: {label: "Ask before you take any job", hint: "Work permission for students is limited. Speak to your international student office first."}
    de_blocked_account: {label: "Check the blocked-account step for your visa", hint: "Many student visas ask you to show funds in a blocked account. Check the embassy page; your university can help."}
    de_register_address: {label: "Register your address (Anmeldung)", hint: "Germany usually asks you to register where you live soon after you move in. Ask your city office or university."}
    au_oshc: {label: "Keep your student health cover active (OSHC)", hint: "Your visa normally requires health cover for the whole stay. Keep the card and the policy number."}
    ca_study_permit: {label: "Keep your study permit papers safe", hint: "Carry the letter you receive at the border together with your passport. Your university can explain the next steps."}
    ca_sin: {label: "Ask about a Social Insurance Number", hint: "You normally need one before you can work. Ask the international office when and how."}
    my_student_pass: {label: "Complete your student pass steps with the university", hint: "Universities usually guide new students through the immigration steps. Follow their instructions and keep copies."}
  kind: regulatory
  verified: false
  source_url: "https://example.org/replace-with-official-student-guidance"
  last_checked: "2026-10-17"
  note: "Indicative first-weeks advice. Rules for visas, work and registration differ and change: check your university's international office and the official government page."

