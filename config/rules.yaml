# StudyRoute rules configuration (blueprint section 13).
#
# Every rule that can change lives here or in the config_rules table, never in code.
# A node that has a `value` key is a rule. Each rule carries:
#   value         the setting
#   kind          sandbox_design | synthetic | regulatory
#   verified      true only when the value was checked against an official source
#   source_url    where it was (or must be) checked
#   last_checked  date of the last check (YYYY-MM-DD)
#   note          free text shown next to the rule
# Rules with verified: false are shown with a yellow "Not verified" badge in the app and
# always carry the sentence "Indicative. Confirm with your AD bank."
# The file seeds the database once. After that the database is authoritative and admins
# change rules through PUT /api/v1/config/rules (audited).

schema_version: 1

engine:
  quote_ttl_seconds:
    value: 300
    kind: sandbox_design
    verified: true
    note: "How long a quote stays valid (blueprint 6.5)."
  mfa_proof_ttl_seconds:
    value: 300
    kind: sandbox_design
    verified: true
    note: "A fresh MFA proof is valid for five minutes."
  settlement_business_days:
    value: 3
    kind: sandbox_design
    verified: true
    note: "Typical SWIFT settlement is same day to about T+3 (blueprint 5.4)."
  planner_buffer_days:
    value: 2
    kind: sandbox_design
    verified: true
    note: "Safety buffer added by the deadline planner."
  bank_cutoff_local:
    value: "15:00"
    kind: sandbox_design
    verified: false
    source_url: "https://example.org/replace-with-your-ad-bank-cutoff"
    last_checked: "2026-10-13"
    note: "Assumed AD bank cut-off in Dhaka time. Confirm with your AD bank."
  ben_deducts_fixed_fee:
    value: true
    kind: sandbox_design
    verified: true
    note: "Under BEN the provider fixed fee is deducted from the beneficiary (blueprint 6.2)."
  idempotency_ttl_hours:
    value: 24
    kind: sandbox_design
    verified: true
    note: "How long a stored Idempotency-Key response is kept (blueprint 8.4)."

