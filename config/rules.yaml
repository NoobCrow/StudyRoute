    cas_number: {label: "CAS statement (UK)", hint: "Confirmation of Acceptance for Studies, if the university issues one."}
    i20_form: {label: "Form I-20 (US)", hint: "Certificate of Eligibility issued by the US school."}
    coe: {label: "Confirmation of Enrolment (Australia)", hint: "Issued by the Australian provider."}
