name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Fails on private keys, API keys, JWTs, passport-like numbers, real e-mails and TODOs.
      - run: python scripts/scan_repo.py

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      # Known-vulnerability scan of the pinned backend lock and of the npm production tree.
      - run: pip-audit -r backend/requirements.txt --no-deps --disable-pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm audit --omit=dev
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The judges' command: build both images, start the stack and wait for the health checks.
      - run: docker compose up -d --build --wait --wait-timeout 240
      # Web server, security headers once each, API through the proxy, sandbox marker.
      - run: python scripts/docker_smoke.py http://localhost:8080
      # The twelve-step demo against the API inside its container.
      - run: docker compose exec -T backend python -m app.scripts.demo_flow
      - name: Show the container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop and delete the data volume
        if: always()
        run: docker compose down -v
