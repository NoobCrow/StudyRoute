name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  # The web UI (web/, Next.js). Builds the static export, checks its Content-Security-Policy hashes through the
  # Playwright smoke test (it serves web/out with the generated headers) and runs the unit and axe tests.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Real Chrome (preinstalled on the runner) against the production build and its security headers.
      - run: npm run e2e

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci --no-fund
      # The build tool is dev-only, but it must not carry known vulnerabilities either.
      - run: npm audit
      # Rebuild the Solidity contracts. The committed artifacts must be exactly what the sources
      # produce, so a changed contract cannot ship without its rebuilt bytecode.
      - run: npm run build
      - run: git diff --exit-code -- ../backend/app/chain/artifacts

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Fails on private keys, API keys, JWTs, passport-like numbers, real e-mails and TODOs.
      - run: python scripts/scan_repo.py

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      # Known-vulnerability scan of the pinned backend lock and of the npm production tree.
      - run: pip-audit -r backend/requirements.txt --no-deps --disable-pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm audit --omit=dev
        working-directory: web

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The judges' command: build both images (the web one runs the Next.js build), start the stack and wait for the health checks.
      - run: docker compose up -d --build --wait --wait-timeout 240
      # Web server, security headers once each, API through the proxy, sandbox marker.
      - run: python scripts/docker_smoke.py http://localhost:8080
      # The fourteen-step demo against the API inside its container.
      - run: docker compose exec -T backend python -m app.scripts.demo_flow
      - name: Show the container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop and delete the data volume
        if: always()
        run: docker compose down -v
