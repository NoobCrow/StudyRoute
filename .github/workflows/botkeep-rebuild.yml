name: Rebuild Botkeep frontend

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    if: github.ref == 'refs/heads/botkeep'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: botkeep
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run typecheck && npm test && npm run build
        working-directory: web
      - run: python scripts/prepare_botkeep.py
      - name: Commit only generated public frontend files
        run: |
          git config user.name "Botkeep build"
          git config user.email "botkeep-build@automation.test"
          git add deploy/botkeep/site deploy/botkeep/site-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild Botkeep frontend"
            git push origin HEAD:botkeep
          fi
