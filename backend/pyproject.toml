[project]
name = "studyroute-backend"
version = "1.0.0"
description = "StudyRoute sandbox: cross-border student payment assistant (synthetic data, no real money)."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "C4", "PT", "RUF"]
ignore = [
  "S311",    # random is only used for synthetic data, never for security
  "RUF012",  # SQLAlchemy / pydantic class attributes are not mutable-default bugs
  "B008",    # FastAPI Depends() in argument defaults is the idiomatic pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "PT011", "PT012", "E501"]
"app/scripts/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]
